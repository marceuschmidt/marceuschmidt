<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Pipeline de dados animado: Fontes, Ingestão com Python, Armazenamento no AWS S3, Transformação com SQL e Insights">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#16303b"/>
      <stop offset="1" stop-color="#203a43"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ec4b6" stop-opacity="0.1"/>
      <stop offset="0.5" stop-color="#2ec4b6" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffb703" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: 'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace; }
      .sans { font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; }
      .title { font-size: 14px; font-weight: 600; fill: #e0fbfc; }
      .sub { font-size: 11px; fill: #8fb3c4; }
      .box { fill: #0b1a22; stroke: #2ec4b6; stroke-width: 1.5; }
      .emoji { font-size: 22px; }
    </style>
  </defs>

  <!-- fundo -->
  <rect width="900" height="240" rx="16" fill="url(#bg)"/>

  <!-- cabeçalho estilo terminal -->
  <circle cx="30" cy="28" r="5" fill="#ff5f56"/>
  <circle cx="48" cy="28" r="5" fill="#ffbd2e"/>
  <circle cx="66" cy="28" r="5" fill="#27c93f"/>
  <text x="88" y="32" class="mono" font-size="13" fill="#8fb3c4">$ python pipeline.py --run</text>
  <rect x="298" y="21" width="8" height="14" fill="#2ec4b6">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <circle cx="770" cy="28" r="4" fill="#27c93f" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="782" y="32" class="mono" font-size="12" fill="#8fb3c4">running</text>

  <!-- trilho do fluxo -->
  <path id="rail" d="M 35 130 H 865" stroke="url(#flow)" stroke-width="2" stroke-dasharray="6 6" fill="none">
    <animate attributeName="stroke-dashoffset" from="24" to="0" dur="0.8s" repeatCount="indefinite"/>
  </path>

  <!-- pacotes de dados -->
  <g fill="#2ec4b6" filter="url(#glow)">
    <circle r="4"><animateMotion dur="4s" begin="0s" repeatCount="indefinite"><mpath href="#rail"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="4s" begin="0.8s" repeatCount="indefinite"><mpath href="#rail"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="4s" begin="1.6s" repeatCount="indefinite"><mpath href="#rail"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="4s" begin="2.4s" repeatCount="indefinite"><mpath href="#rail"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="4s" begin="3.2s" repeatCount="indefinite"><mpath href="#rail"/></animateMotion></circle>
  </g>
  <g fill="#ffb703" filter="url(#glow)">
    <circle r="3"><animateMotion dur="4s" begin="0.4s" repeatCount="indefinite"><mpath href="#rail"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="4s" begin="2s" repeatCount="indefinite"><mpath href="#rail"/></animateMotion></circle>
  </g>

  <!-- etapas -->
  <g class="sans">
    <!-- 1. Fontes -->
    <rect x="35" y="88" width="130" height="84" rx="12" class="box">
      <animate attributeName="stroke-opacity" values="0.35;1;0.35;0.35" keyTimes="0;0.1;0.3;1" dur="4s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <text x="100" y="120" text-anchor="middle" class="emoji">🗂️</text>
    <text x="100" y="146" text-anchor="middle" class="title">Fontes</text>
    <text x="100" y="162" text-anchor="middle" class="sub mono">APIs · CSV · DBs</text>

    <!-- 2. Ingestão -->
    <rect x="210" y="88" width="130" height="84" rx="12" class="box">
      <animate attributeName="stroke-opacity" values="0.35;1;0.35;0.35" keyTimes="0;0.1;0.3;1" dur="4s" begin="0.85s" repeatCount="indefinite"/>
    </rect>
    <text x="275" y="120" text-anchor="middle" class="emoji">🐍</text>
    <text x="275" y="146" text-anchor="middle" class="title">Ingestão</text>
    <text x="275" y="162" text-anchor="middle" class="sub mono">Python</text>

    <!-- 3. Armazenamento -->
    <rect x="385" y="88" width="130" height="84" rx="12" class="box">
      <animate attributeName="stroke-opacity" values="0.35;1;0.35;0.35" keyTimes="0;0.1;0.3;1" dur="4s" begin="1.7s" repeatCount="indefinite"/>
    </rect>
    <text x="450" y="120" text-anchor="middle" class="emoji">☁️</text>
    <text x="450" y="146" text-anchor="middle" class="title">Armazenamento</text>
    <text x="450" y="162" text-anchor="middle" class="sub mono">AWS S3</text>

    <!-- 4. Transformação -->
    <rect x="560" y="88" width="130" height="84" rx="12" class="box">
      <animate attributeName="stroke-opacity" values="0.35;1;0.35;0.35" keyTimes="0;0.1;0.3;1" dur="4s" begin="2.55s" repeatCount="indefinite"/>
    </rect>
    <text x="625" y="120" text-anchor="middle" class="emoji">🧮</text>
    <text x="625" y="146" text-anchor="middle" class="title">Transformação</text>
    <text x="625" y="162" text-anchor="middle" class="sub mono">SQL</text>

    <!-- 5. Insights (mini gráfico animado) -->
    <rect x="735" y="88" width="130" height="84" rx="12" class="box" style="stroke:#ffb703">
      <animate attributeName="stroke-opacity" values="0.35;1;0.35;0.35" keyTimes="0;0.1;0.3;1" dur="4s" begin="3.4s" repeatCount="indefinite"/>
    </rect>
    <g fill="#ffb703">
      <rect x="782" y="112" width="7" height="12" rx="1.5">
        <animate attributeName="height" values="6;14;9;6" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="118;110;115;118" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="792" y="106" width="7" height="18" rx="1.5">
        <animate attributeName="height" values="10;18;12;10" dur="2.4s" begin="0.3s" repeatCount="indefinite"/>
        <animate attributeName="y" values="114;106;112;114" dur="2.4s" begin="0.3s" repeatCount="indefinite"/>
      </rect>
      <rect x="802" y="109" width="7" height="15" rx="1.5">
        <animate attributeName="height" values="8;16;20;8" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="116;108;104;116" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="812" y="104" width="7" height="20" rx="1.5">
        <animate attributeName="height" values="12;20;16;12" dur="2.4s" begin="0.9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="112;104;108;112" dur="2.4s" begin="0.9s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="800" y="146" text-anchor="middle" class="title">Insights</text>
    <text x="800" y="162" text-anchor="middle" class="sub mono">Dashboards</text>
  </g>

  <!-- rodapé -->
  <text x="450" y="210" text-anchor="middle" class="mono" font-size="12" fill="#5f8a9b">raw data ──▶ decisões</text>
</svg>
